name: NimClaim CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: nimclaim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Typecheck, unit, runtime and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run application checks
        run: npm run check

      - name: Check formatting
        run: npm run format:check

  postgres:
    name: PostgreSQL 17 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Pull disposable PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
