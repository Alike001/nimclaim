name: Format approved rewards handoff

on:
  push:
    branches:
      - feat/mainnet-approved-rewards-handoff

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Format changed application and test files
        run: npx prettier --write src/App.tsx src/payout-export.ts src/style.css tests/browser/mainnet.spec.ts tests/payout-export.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/payout-export.ts src/style.css tests/browser/mainnet.spec.ts tests/payout-export.test.ts
          git commit -m "style: format approved rewards handoff"
          git push
